name: Комплекты SDLC
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/distribution.py sync
      - run: python implementations/codex/test_package.py
      - run: python implementations/kimi-code/test_package.py
      - name: Проверить актуальность ресурсов
        run: python tools/distribution.py check
      - run: python check.py
      - run: python tools/distribution.py package
      - uses: actions/upload-artifact@v4
        with:
          name: sdlc-${{ matrix.os }}
          path: dist/*
  update:
    concurrency:
      group: sdlc-resource-update
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/distribution.py sync
      - run: python implementations/codex/test_package.py
      - run: python implementations/kimi-code/test_package.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sdlc-resources
          title: 'Обновить установочные ресурсы SDLC'
          commit-message: 'Обновить установочные ресурсы SDLC'
          body: 'Синхронизация канонических ресурсов и контрольных сумм. Тексты навыков не изменяются.'
          add-paths: |
            implementations/claude-code/skills/**/templates/**
            implementations/claude-code/skills/sdlc-verify/tools/**
            implementations/codex/skills/**/templates/**
            implementations/codex/skills/sdlc-verify/tools/**
            implementations/codex/skills/sdlc-run/references/SDLC.md
            implementations/codex/manifest.json
            implementations/codex/generated-resources.json
            implementations/cursor/skills/**
            implementations/cursor/manifest.json
            implementations/opencode/skills/**
            implementations/opencode/manifest.json
            implementations/kimi-code/skills/**
            implementations/kimi-code/manifest.json
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/distribution.py check
      - name: Определить тег сборки
        id: release-tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Проверить версию
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import json,os; assert 'v'+json.load(open('implementations/codex/manifest.json'))['version']==os.environ['GITHUB_REF_NAME']"
      - run: python tools/distribution.py package
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --latest --title "$RELEASE_TAG" --notes "Комплекты Agent-SDLC. Ревизия: $GITHUB_SHA."
          fi
      - name: Подготовить OCI-пакет
        run: cp packages/Dockerfile dist/Dockerfile
      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Подготовить имя пакета
        id: package-name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-sdlc" >> "$GITHUB_OUTPUT"
      - name: Опубликовать GitHub Package
        uses: docker/build-push-action@v6
        with:
          context: dist
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.package-name.outputs.image }}:${{ steps.release-tag.outputs.tag }}
            ${{ steps.package-name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release-tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
